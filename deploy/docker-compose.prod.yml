# Production stack for a single VPS. Build/validate locally; nothing here deploys itself.
#   cp deploy/.env.example deploy/.env   (then edit)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: deepkhata

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepkhata}
      POSTGRES_DB: ${POSTGRES_DB:-deepkhata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: reachable only on the internal compose network.

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: ghcr.io/${GHCR_OWNER:-local}/deepkhata-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_AGENCY_URL: https://admin.${DOMAIN}
    image: ghcr.io/${GHCR_OWNER:-local}/deepkhata-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: "3000"
    depends_on:
      - api

  admin:
    build:
      context: ..
      dockerfile: apps/agency-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    image: ghcr.io/${GHCR_OWNER:-local}/deepkhata-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      PORT: "3001"
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - api
      - admin

  # Nightly pg_dump -> R2 (02:30 PKT), weekly restore test (Sun 04:00). See deploy/backup.
  backup:
    build:
      context: ./backup
    image: deepkhata-backup:local
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Karachi
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
