name: CI

on:
  pull_request:
  push:
    branches: [main, final-fixes]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deepkhata
          POSTGRES_PASSWORD: deepkhata
          POSTGRES_DB: deepkhata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepkhata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://deepkhata:deepkhata@localhost:5432/deepkhata_test
      DIRECT_URL: postgresql://deepkhata:deepkhata@localhost:5432/deepkhata_test
      DATABASE_URL_TEST: postgresql://deepkhata:deepkhata@localhost:5432/deepkhata_test
      ACCESS_TOKEN_SECRET: ci-only-not-a-secret-0123456789abcdef
      REFRESH_TOKEN_SECRET: ci-only-not-a-secret-0123456789abcdef
      APP_NAME: DeepKhata
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run prisma:migrate -w server
      - run: npm run db:seed
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
