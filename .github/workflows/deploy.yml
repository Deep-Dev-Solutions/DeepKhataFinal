name: deploy

# Triggered by pushing a tag such as v1.0.0. Builds images to GHCR, then deploys to the VPS
# with a health check and automatic rollback to the previous IMAGE_TAG.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-api:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-client:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agency-admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-admin:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/deepkhata-admin:latest
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ github.ref_name }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_TAG,GHCR_OWNER,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/deepkhata
            COMPOSE="docker compose -f docker-compose.prod.yml"

            set_env() { # key value
              if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi
            }

            PREV_TAG="$(grep '^IMAGE_TAG=' .env | cut -d= -f2- || true)"
            PREV_TAG="${PREV_TAG:-latest}"
            DOMAIN="$(grep '^DOMAIN=' .env | cut -d= -f2-)"
            echo "previous tag: ${PREV_TAG}; deploying: ${NEW_TAG}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            set_env GHCR_OWNER "$GHCR_OWNER"
            set_env IMAGE_TAG "$NEW_TAG"
            $COMPOSE pull api client admin
            $COMPOSE build backup
            $COMPOSE up -d

            healthy=0
            for i in $(seq 1 10); do
              if curl -fsS --max-time 10 "https://api.${DOMAIN}/health" >/dev/null; then
                healthy=1; break
              fi
              echo "health check ${i}/10 failed; retrying in 10s"
              sleep 10
            done

            if [ "$healthy" -ne 1 ]; then
              echo "DEPLOY FAILED: rolling back to ${PREV_TAG}"
              set_env IMAGE_TAG "$PREV_TAG"
              $COMPOSE up -d
              exit 1
            fi
            echo "deploy ok: ${NEW_TAG}"
            docker image prune -f
