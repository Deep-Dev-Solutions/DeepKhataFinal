services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: deepkhata
      POSTGRES_PASSWORD: deepkhata
      POSTGRES_DB: deepkhata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepkhata"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles:
      - redis

volumes:
  postgres_data:
